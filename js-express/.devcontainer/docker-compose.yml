# Merged with the repo-root docker-compose.yml by the dev container, so the `app`
# service joins the same `benchmark-net` network as the shared postgres + redis.
#
# NOTE: the dev container runs compose with the repo root as the project
# directory (the first file in dockerComposeFile is ../../docker-compose.yml), so
# relative volume paths below resolve from the repo root. We mount the whole repo
# at /workspace and land the workspace in the js-express/ subfolder.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    command: sleep infinity
    volumes:
      - .:/workspace:cached
    working_dir: /workspace/js-express
    environment:
      PORT: "3001"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: bench
      PGPASSWORD: bench
      PGDATABASE: taskbench
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - benchmark-net
