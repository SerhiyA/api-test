# Self-contained dev container stack for js-express.
#
# The VS Code Dev Containers extension runs compose with the COMPOSE FILE's
# folder (.devcontainer/) as the project directory, so relative paths below
# resolve from js-express/.devcontainer/:
#     ../..            -> repo root (api-test/)   [mounted at /workspace]
#     ../../shared/... -> the real shared/ schema + seed
#
# Same project name + network as the other implementations, so Postgres/Redis
# containers and their data volumes are shared (start one impl, the rest reuse).
# Postgres/Redis are NOT published to the host here (the app reaches them over
# the internal network), which avoids clashing with any host Postgres/Redis.
name: task-benchmark

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    command: sleep infinity
    volumes:
      - ../..:/workspace:cached
    working_dir: /workspace/js-express
    environment:
      PORT: "3001"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: bench
      PGPASSWORD: bench
      PGDATABASE: taskbench
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - benchmark-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: taskbench
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../shared/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d taskbench"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark-net

volumes:
  pgdata:
  redisdata:

networks:
  benchmark-net:
    name: benchmark-net
