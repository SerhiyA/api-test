# Self-contained dev container stack for rust-axum.
#
# The VS Code Dev Containers extension runs compose with the COMPOSE FILE's
# folder (.devcontainer/) as the project directory, so relative paths resolve
# from rust-axum/.devcontainer/:
#     ../..            -> repo root (api-test/)   [mounted at /workspace]
#     ../../shared/... -> the real shared/ schema + seed
#
# Same project name + network as the other implementations (shared Postgres +
# Redis). The dev service is named `app-rust` to avoid colliding with the others.
name: task-benchmark

services:
  app-rust:
    image: mcr.microsoft.com/devcontainers/rust:1
    command: sleep infinity
    volumes:
      - ../..:/workspace:cached
    working_dir: /workspace/rust-axum
    environment:
      PORT: "3004"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: bench
      PGPASSWORD: bench
      PGDATABASE: taskbench
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - benchmark-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: taskbench
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../shared/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d taskbench"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - benchmark-net

volumes:
  pgdata:
  redisdata:

networks:
  benchmark-net:
    name: benchmark-net
